name: Avisos da agenda

# A cada 5 minutos, das 7h às 23h (horário de Brasília), pede pro sistema
# mandar os avisos da agenda que estiverem na hora. Também mantém o
# sistema acordado nesse horário.
on:
  schedule:
    - cron: "*/5 0-1,10-23 * * *"
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o sistema
        run: |
          curl -fsS --max-time 90 --retry 2 "${{ vars.SISTEMA_URL || 'https://comercia-vendas.onrender.com' }}/tarefas/avisos" || true

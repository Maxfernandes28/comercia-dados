name: Base da Receita (mensal)

# Todo dia 20 (a Receita costuma publicar no começo/meio do mês) e quando
# alguém clicar em "Run workflow".
on:
  schedule:
    - cron: "17 6 20 * *"
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do mês (vazio = a mais recente). Ex.: /Dados/Cadastros/CNPJ/2026-09/"
        required: false

permissions:
  contents: write

concurrency:
  group: receita
  cancel-in-progress: false

jobs:
  separar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Baixar e separar
        run: python processar.py ${{ github.event.inputs.pasta }}
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for pasta in saida/*/; do
            tag=$(basename "$pasta")
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Empresas ativas da base aberta da Receita Federal, separadas por atividade (divisão do CNAE). Gerado automaticamente."
            gh release upload "$tag" "$pasta"* --clobber
          done
          echo "Publicado:" && cat saida/base/meta.json | head -5
